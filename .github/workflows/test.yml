on:
  pull_request:
  push:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flake-check:
    strategy:
      matrix:
        os: [ubuntu-latest]
    name: Nix flake check ${{matrix.os}}
    runs-on: ${{matrix.os}}
    steps:
      - uses: wimpysworld/nothing-but-nix@main
        if: matrix.os == 'ubuntu-latest'
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: actions/checkout@v5
      - run: nix flake metadata
      - run: |
          cat <<-EOF > modules/ci-runtime.nix
          {
            _module.args.CI = true;
          }
          EOF
      - run: nix flake check --accept-flake-config
  cachix-push:
    if: github.event_name == 'push'
    needs: flake-check
    strategy:
      matrix:
        os: [ubuntu-latest]
    name: Push packages/* to cachix ${{matrix.os}}
    runs-on: ${{matrix.os}}
    steps:
      - uses: wimpysworld/nothing-but-nix@main
        if: matrix.os == 'ubuntu-latest'
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: actions/checkout@v5
      - uses: cachix/cachix-action@v15
        with:
          name: heraldofsolace
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: |
          for pkg in $(nix eval --json .#packages.x86_64-linux --apply builtins.attrNames --accept-flake-config | jq -r '.[]'); do
            nix build ".#packages.x86_64-linux.$pkg" --accept-flake-config --print-out-paths
          done
