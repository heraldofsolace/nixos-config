on:
  pull_request:
  push:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flake-check:
    strategy:
      matrix:
        os: [ubuntu-latest]
    name: Nix flake check ${{matrix.os}}
    runs-on: ${{matrix.os}}
    steps:
      - uses: wimpysworld/nothing-but-nix@main
        if: matrix.os == 'ubuntu-latest'
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: actions/checkout@v5
      - run: nix flake metadata
      # Nothing may be written into the checkout: the check runs against exactly the
      # committed tree, and `just ci` is the single source of truth for what CI runs.
      - name: Assert the checkout is clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      # `just` comes from this flake's own nixpkgs, so CI runs the same version a devshell
      # gives you: no extra action to pin and no second copy of the check command to drift.
      - name: just ci
        run: nix shell --inputs-from . nixpkgs#just -c just ci
  cachix-push:
    if: github.event_name == 'push'
    needs: flake-check
    strategy:
      matrix:
        os: [ubuntu-latest]
    name: Push packages/* to cachix ${{matrix.os}}
    runs-on: ${{matrix.os}}
    steps:
      - uses: wimpysworld/nothing-but-nix@main
        if: matrix.os == 'ubuntu-latest'
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: actions/checkout@v5
      - uses: cachix/cachix-action@v15
        with:
          name: heraldofsolace
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: |
          for pkg in $(nix eval --json .#packages.x86_64-linux --apply builtins.attrNames --accept-flake-config | jq -r '.[]'); do
            nix build ".#packages.x86_64-linux.$pkg" --accept-flake-config --print-out-paths
          done
