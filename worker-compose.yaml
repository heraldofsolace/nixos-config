namespace: default
startup_timeout: 360s
stop_timeout: 10s

engine:
  url: ws://127.0.0.1:49134

containers:
  queue:
    worker: package://queue
    version: "latest"

  state:
    worker: package://state
    version: "latest"

  session-manager:
    worker: package://session-manager
    version: "latest"

  llm-router:
    worker: package://llm-router
    version: "latest"
    start_after:
    - secrets
    - state
    # Every provider key resolves in the router's process, not in the provider
    # worker, and is read from ./.env. When you uncomment a provider below,
    # uncomment its key in ./.env too.
    env_file: [/run/secrets/iii-api-keys]
    environment:
      RUST_LOG: info

  provider-anthropic:
    worker: package://provider-anthropic
    version: "latest"
    start_after:
      - llm-router
      - state

  # provider-openai:
  #   worker: package://provider-openai
  #   version: "1.2.21"
  #   start_after:
  #     - llm-router
  #     - state
  #   environment:
  #     RUST_LOG: info

  # Enabled by default; its key in ./.env is optional.
  provider-deepseek:            # DEEPSEEK_API_KEY
    worker: package://provider-deepseek
    version: "latest"
    start_after:
      - llm-router
      - state

  # Additional providers. Uncomment a block, uncomment its key in ./.env, and
  # run `iii trigger compose::restart` so compose re-reads this file.
  # llm-router reads every provider key from ./.env through its `env_file`; a
  # key exported in the shell does not reach it. Add the container to the
  # `harness` start_after list below if the harness should wait for it.

  #  provider-kimi:                # MOONSHOT_API_KEY, not KIMI_API_KEY
  #    worker: package://provider-kimi
  #    version: "latest"
  #    start_after:
  #      - llm-router
  #      - state

  #  provider-xai:                 # XAI_API_KEY
  #    worker: package://provider-xai
  #    version: "latest"
  #    start_after:
  #      - llm-router
  #      - state

  #  provider-zai:                 # ZAI_API_KEY
  #    worker: package://provider-zai
  #    version: "latest"
  #    start_after:
  #      - llm-router
  #      - state

  #  provider-openrouter:          # OPENROUTER_API_KEY
  #    worker: package://provider-openrouter
  #    version: "latest"
  #    start_after:
  #      - llm-router
  #      - state

  #  provider-llamacpp:            # LLAMACPP_API_KEY
  #    worker: package://provider-llamacpp
  #    version: "latest"
  #    start_after:
  #      - llm-router
  #      - state

  # Providers that need no API key (experimental):
  #   provider-openai-codex    reads ~/.codex/auth.json, written by the Codex CLI
  #                            when you sign in there.
  #   provider-claude-code     reads ~/.claude/.credentials.json, written by the
  #                            Claude Code CLI when you sign in there.
  #   provider-github-copilot  runs a GitHub device flow. Run
  #                            iii trigger provider::github-copilot::login::start,
  #                            enter the user_code at the verification URL, then
  #                            iii trigger provider::github-copilot::login::poll.

  #  provider-openai-codex:
  #    worker: package://provider-openai-codex
  #    version: "latest"
  #    start_after:
  #      - llm-router
  #      - state

  #  provider-claude-code:
  #    worker: package://provider-claude-code
  #    version: "latest"
  #    start_after:
  #      - llm-router
  #      - state

  #  provider-github-copilot:
  #    worker: package://provider-github-copilot
  #    version: "latest"
  #    start_after:
  #      - llm-router
  #      - state

  context-manager:
    worker: package://context-manager
    version: "latest"
    start_after:
      - llm-router

  iii-directory:
    worker: package://iii-directory
    version: "latest"

  cron:
    worker: package://cron
    version: "latest"

  ade: # the ADE web UI (registers console::*)
    worker: package://ade
    version: "latest"

  ide: # files and commands for agents and the ADE (registers shell::* and coder::*)
    worker: package://ide
    version: "latest"

  harness:
    worker: package://harness
    version: "latest"
    start_after:
    - ade
    - context-manager
    - cron
    - ide
    - iii-directory
    - judge
    - llm-router
    - provider-anthropic
    - provider-deepseek
    - provider-openai
    - provider-openai-codex
    - queue
    - session-manager
    - state

  browser: # Chromium sessions + one-shot fetches (browser::fetch) for verification
    worker: package://browser
    version: "latest"

  document:
    worker: package://document
    version: "latest"
  pdf: # PDF parsing and text extraction
    worker: package://pdf
    version: "latest"
  kanban: # Kanban board for tasks and notes
    worker: package://kanban
    version: "0.1.18"
  # added by compose::add
  tailscale:
    worker: package://api.workers.iii.dev/tailscale
    version: "latest"
    start_after:
    - ade
  # added by compose::add
  worktree:
    worker: package://api.workers.iii.dev/worktree
    version: "latest"
    start_after:
    - ide
    - state

  # local worker: hosts, generations, the land gate and worker health (workers/fleet)
  fleet:
    worker: path:///home/aniket/my-nix/workers/fleet
    start_after:
      - ade
    scripts:
      # dependencies are installed on the host into this directory (gitignored
      # node_modules); the guest image ships no package manager, so installing there
      # fails — assert the host install instead.
      pre_run: test -d node_modules/iii-sdk
      run: node src/index.js
    environment:
      PATH: /usr/local/bin:/usr/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin:/workspace/node_modules/.bin
  # added by compose::add
  secrets:
    worker: package://api.workers.iii.dev/secrets
    version: "latest"
  # added by compose::add
  judge-typesafe:
    worker: package://api.workers.iii.dev/judge-typesafe
    version: "latest"
  # added by compose::add
  judge:
    worker: package://api.workers.iii.dev/judge
    version: "latest"
    start_after:
    - judge-typesafe
  # added by compose::add
  provider-openai:
    worker: package://api.workers.iii.dev/provider-openai
    version: "latest"
    start_after:
    - llm-router
    - state
  # added by compose::add
  provider-openai-codex:
    worker: package://api.workers.iii.dev/provider-openai-codex
    version: "latest"
    start_after:
    - llm-router
    - state
